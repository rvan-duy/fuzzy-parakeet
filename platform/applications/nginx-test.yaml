apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:                                                                 
  name: nginx-test                                                         
  namespace: argocd
spec:
  project: default
  source:                                                                 
    repoURL: https://github.com/rvan-duy/fuzzy-parakeet.git               
    targetRevision: main
    path: app/nginx                                                       
    helm:                                                                 
      valueFiles:                                                         
        - values-test.yaml                                                 
                                                                             
  destination:                                                            
    server: https://kubernetes.default.svc                                
    namespace: test
                                                                             
  syncPolicy:                                                             
    automated:                                                            
      enabled: true                                                       
      prune: true                                    
    syncOptions:                                                          
      - CreateNamespace=true